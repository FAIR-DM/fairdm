# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    uv: "latest"

  jobs:
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      # Install dependencies with the 'docs' dependency group
      # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-uv
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --group docs

formats: all

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/conf.py
