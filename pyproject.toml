[project]
name = "fairdm"
description = ""
license = "MIT"
keywords = [
    "research",
    "database",
    "research data management",
    "open data",
    "fairdm",
    "FAIR",
]
version = "0.0.1"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "Samuel Jennings" }]
requires-python = '>=3.13,<4.0'
dependencies = [
    "celery (>=5.6.2,<6.0.0)",
    'crispy-tailwind (>=1.0.3,<2.0.0)',
    'django[argon2] (>=5.2,<6.0.0)',
    'django-admin-extra-buttons>=1.5.8,<3.0.0',
    'django-adminactions (>=2.0.0,<3.0.0)',
    'django-allauth[mfa,socialaccount] (>=65.19.4,<66.0.0)',
    'django-celery-beat (>=2.5.0,<3.0.0)',
    'django-classy-tags (>=4.1.0,<5.0.0)',
    'django-cleanup>=8.1.0,<10.0.0',
    'django-compressor (>=4.5.1,<5.0.0)',
    'django-contact-form>=2.1,<6.0',
    'django-crispy-forms (>=2.3,<3.0)',
    'django-dbbackup>=4.0.2,<6.0.0',
    'django-downloadview (>=2.3.0,<3.0.0)',
    'django-environ>=0.10.0,<0.15.0',
    'django-filter>=24.3,<27.0',
    'django-htmx (>=1.29.0,<2.0.0)',
    'django-import-export (>=4.0.3,<5.0.0)',
    'django-libsass (>=0.9,<0.10)',
    'django-meta (>=2.1.0,<3.0.0)',
    'django-model-utils>=4.3.1,<6.0.0',
    'django-parler (>=2.3,<3.0)',
    'django-pint>=0.7.3,<1.1.0',
    'django-redis>=5.2.0,<8.0.0',
    'django-select2 (>=8.4.1,<9.0.0)',
    'django-social-share (>=2.3.0,<3.0.0)',
    'django-solo (>=2.2.0,<3.0.0)',
    'django-split-settings (>=1.2.0,<2.0.0)',
    'django-storages[boto3] (>=1.14.2,<2.0.0)',
    "django-tables2 (>=3.0.1)",
    'defusedxml (>=0.7.0,<0.8.0)',
    'easy-thumbnails (>=2.10,<3.0)',
    'flower (>=2.1.0,<3.0.0)',
    'gunicorn>=23.0.0,<27.0.0',
    'psycopg2-binary (>=2.9.13,<3.0.0)',
    'redis>=4.5.2,<9.0.0',
    'whitenoise (>=6.4.0,<7.0.0)',
    'django-research-vocabs @ git+https://github.com/SamuelJennings/django-research-vocabs',
