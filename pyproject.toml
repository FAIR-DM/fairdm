    # fairdm/templatetags/fairdm.py, partial_date via fairdm/db/fields.py and
    # fairdm/forms/, requests via fairdm/contrib/contributors/tasks.py.
    "pint (>=0.26.1,<1.0)",
    "django-partial-date (>=1.3,<2.0)",
    "requests (>=2.32,<3.0)",
    "django-orbit[mcp] (>=0.12.1,<0.13.0)",
]

[project.optional-dependencies]
# GIS support (fairdm/contrib/location/serializers.py, api.py) is dormant:
# django.contrib.gis is commented out of INSTALLED_APPS, and
# djangorestframework-gis pulls in GDAL, a heavy system library. Declaring it
# as a hard dependency would tax every portal install, so it lives behind the
# `gis` extra instead: `pip install fairdm[gis]`. The two modules that need it
# guard their imports and raise ImproperlyConfigured naming the extra when it
# is absent.
gis = ["djangorestframework-gis (>=1.3.0,<2.0.0)"]

[project.urls]
Homepage = "https://www.fairdm.com"
Documentation = "https://www.fairdm.com"
Repository = "https://github.com/FAIR-DM/fairdm"
Issues = "https://github.com/FAIR-DM/fairdm/issues"
Changelog = "https://github.com/FAIR-DM/fairdm/blob/main/CHANGELOG.md"

[dependency-groups]
# Toolchain bundle pinned to a shared tag. Ships ruff, mypy, deptry, pre-commit,
# pytest, pytest-django, coverage and django-stubs.
dev = [
    "mvp-shared[dev,test]",
    "fairdm-discussions",
    "pytest-mock>=3.15.1,<4.0",
    "django>=5.2.17,<6.0",
]
docs = [
    "fairdm-docs[pydata-sphinx-theme]",
    "sphinxcontrib-mermaid>=2.1.1,<3.0",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }
fairdm-discussions = { git = "https://github.com/FAIR-DM/fairdm-discussions" }
fairdm-docs = { git = "https://github.com/FAIR-DM/fairdm-docs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# django-research-vocabs and django-literature are declared as git URLs above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["fairdm", "demo"]

[tool.hatch.build.targets.sdist]
include = ["/fairdm", "/demo", "/README.md", "/LICENSE"]

[tool.ruff]
extend = "ruff-base.toml"
extend-ignore = [
    # Use of mark_safe: templatetags and form rendering pass pre-escaped
    # trusted content (fairdm/templatetags/fairdm.py, core/forms.py, etc).
    "S308",
    # Use of standard pseudo-random generators: fake-data generation only
    # (fairdm/factories, generate_fake_data command), never security-sensitive.
    "S311",
    # Star imports: plugin registries and the models shim re-export by design
    # (fairdm/plugins.py, contrib/contributors/plugins, db/models.py).
    "F403",
    "F405",
]

[tool.ruff.lint]
# Settings modules are assembled top-to-bottom with conditional imports and
# intentional try/except control flow; excluded from lint, not format.
exclude = ["fairdm/conf/*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "S101",   # Allow assert statements in tests
    "S105",   # Allow hardcoded passwords in tests
    "S106",   # Allow hardcoded passwords in arguments in tests
    "S108",   # Allow insecure temp file usage in tests
    "F821",   # Allow undefined names (common in test fixtures/factories)
    "F841",   # Allow unused local variables in tests
    "A001",   # Allow shadowing builtins in tests (e.g., license, id)
    "E402",   # Allow module level imports not at top (pytest markers)
    "RUF043", # Allow unescaped regex patterns in pytest.raises
]
"**/demo/*" = [
    "F841", # Unused variables in demo/example code
    "E402", # Import ordering in admin (after register decorators)
]
# The root conftest.py is test configuration shared by tests/ and demo/tests/.
"conftest.py" = [
    "S101", # Allow assert statements: its fixtures fail tests by asserting
]
# `[tool.ruff.lint].exclude` above only takes effect when ruff is invoked
# without explicit file paths; the pre-commit hook passes changed files
# directly (no --force-exclude), which bypasses that exclude, so these carry
# the actual enforcement. Settings modules are assembled top-to-bottom with
# conditional imports and intentional try/except control flow.
"fairdm/conf/*" = [
    "E402",   # Module level imports not at top of file (conditional setup)
    "TRY300", # return in try rather than else
    "TRY301", # raise inside try rather than an inner function
    "TRY400", # logging.error rather than logging.exception
    "RUF005", # list concatenation rather than iterable unpacking
]

# djlint is not currently enforced: it runs in no pre-commit hook and no CI job.
# The settings below are kept because they encode real knowledge about the
# template syntax in use, and would have to be rediscovered otherwise. Arming
# the tool means working through its findings across the whole template tree,
# which is a separate piece of work.
[tool.djlint]
blank_line_after_tag = "load,endpartialdef,endblock"
close_void_tags = true
custom_blocks = "addtoblock"
custom_html = "django-formset,c-[\\w.-]+,swiper-container,swiper-slide"
format_js = true
format_css = true
indent = 2
max_attribute_length = 50
max_blank_lines = 0
max_line_length = 119
ignore = "H016,H030,H031,H021,D018,H037"
format_attribute_template_tags = false

[tool.djlint.css]
indent_size = 2


[tool.djlint.js]
indent_size = 2


[tool.mypy]
files = ["fairdm"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
# follow_imports, pretty and mypy_path are deliberately unset. Each one broke the
# run rather than shaping it: "skip" left the django-stubs user-model alias
# unresolved and crashed the semantic analyser, "./fairdm/" made every module
# reachable under two names, and "pretty" indexes the source line of every error
# — which raises IndexError on the synthetic nodes the Django plugin reports past
# the end of a file.
exclude = [
    "docs/",
    "migrations/",
    "tests/settings.py",
    "fairdm/conf/*",
    "fairdm/contrib/*",
    ".*/plugins\\.py$",
]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "fairdm.models"
disable_error_code = ["var-annotated"]

[[tool.mypy.overrides]]
module = "fairdm.db.gis.base"
disable_error_code = ["var-annotated"]

# The Django plugin synthesises a manager class for every `as_manager()` and
# `from_queryset()` call, and the ones built on django-polymorphic's generic
# managers reference type variables it never imports. It reports them against
# the module holding the queryset, at a line past the end of that file, so an
# inline comment cannot reach them. Everywhere the report lands on a real line
# the suppression is inline instead.
[[tool.mypy.overrides]]
module = [
    "fairdm.core.measurement.managers",
    "fairdm.core.sample.managers",
    "fairdm.db.models",
]
disable_error_code = ["name-defined"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
env = ["DJANGO_ENV=development"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# demo/tests belongs here: the reference application is shipped, so it either
# runs on every change and stays green or it is not a suite.
testpaths = ["tests", "demo/tests"]
markers = ["slow: Tests that take > 1 second to execute"]
filterwarnings = ["ignore", "default:::keywords"]
addopts = [
    "--strict-markers",
    "--reuse-db",
    "--no-migrations",
    "--ds=tests.settings",
    # One worker per core, and every test in a class or module on the same
    # worker so class-scoped and module-scoped fixtures are built once.
    "-n=auto",
    "--dist=loadscope",
]
# Coverage can be enabled with: --cov --cov-report html
# A single test is easier to read serially: add -n0 to any invocation.

[tool.coverage.run]
source = ["fairdm"]
branch = true
omit = [
    "*site-packages*",
    "*/tests/*",
    "*.tox*",
    "*__init__.py",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 1
skip_empty = true
show_missing = true
skip_covered = false


[tool.deptry]
extend_exclude = [
    "tasks.py",
    "docs",
    "scripts",
    ".*tests",
    "tests/",
    "demo/tests/",
    # Test configuration shared by both suites, so pytest is a test dependency
    # here in exactly the way it is inside them.
    "conftest.py",
    # Factories are test-support code and depend on factory_boy, which is a
    # dev/test dependency rather than a runtime one.
    "fairdm/factories/",
    "demo/factories.py",
]

known_first_party = ["fairdm", "demo"]

# Django packages whose distribution name differs from the name they are
# imported under. Without this, deptry reads every one of them as declared but
# never used.
package_module_name_map = { django-environ = "environ", django-filter = "django_filters", django-import-export = "import_export", django-meta = "meta", django-model-utils = "model_utils", django-parler = "parler", django-pint = ["django_pint", "quantityfield"], django-solo = "solo", django-split-settings = "split_settings", django-autocomplete-light = "dal", django-braces = "braces", django-auto-prefetch = "auto_prefetch", django-guardian = "guardian", django-polymorphic = "polymorphic", django-content-license = "licensing", django-flex-menus = "flex_menu", django-easy-icons = "easy_icons", django-mvp = "mvp", django-hijack = "hijack", django-research-vocabs = "research_vocabs", django-literature = "literature", django-ordered-model = "ordered_model", django-taggit = "taggit", django-extra-views = "extra_views", django-waffle = "waffle", djangorestframework-gis = "rest_framework_gis" }

[tool.deptry.per_rule_ignores]
# DEP002 = declared but never imported. Django wires most of its moving parts
# through settings strings (INSTALLED_APPS, MIDDLEWARE, storage and cache
# backends) and deploys others as processes, so a static import scan cannot see
# them. Everything below is genuinely used and none of it is dead weight.
DEP002 = [
    "crispy-tailwind",
    "dj-rest-auth",
    "django-accounts-center",
    "django-admin-extra-buttons",
    "django-celery-beat",
    "django-classy-tags",
    "django-cleanup",
    "django-compressor",
    "django-contact-form",
    "django-cors-headers",
    "django-dbbackup",
    "django-htmx",
    "django-libsass",
    "django-orbit",
    "django-redis",
    "django-setup-tools",
    "django-social-share",
    "django-storages",
    "django-widget-tweaks",
    "drf-orjson-renderer",
    "flower",
    "gunicorn",
    "psycopg2-binary",
    "pymdown-extensions",
    "redis",
    "tablib",
    "uncertainties",
    "whitenoise",
]

[tool.fairdm.docs]
port = 8010                   # Live server port (default: 5000)
verbosity = "quiet"           # Options: "full", "quiet", "errors-only"
django = true                 # Enable Django integration (default: false)
theme = "pydata_sphinx_theme" # Sphinx theme to use (default: "alabaster")
