# The development stack, built on the development image (docker/Dockerfile, target development).
# `docker compose up` starts PostGIS, Redis, the development server on http://localhost:8000 and
# a Celery worker, with the source mounted so edits reload and the virtual environment kept in
# the `venv` volume. The first start installs the locked dependencies into that volume. To run
# Django on the host instead, start the databases alone with `docker compose up postgres redis`;
# stack.development.env points the host at them.
name: fairdm

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fairdm
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  django: &django
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app
      - venv:/opt/venv
    ports:
      - "8000:8000"
    command: sh -c "uv sync --locked && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    # The worker waits for this, so the two never install into the venv volume at once.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 10s
      retries: 240

  celeryworker:
    <<: *django
    ports: []
    healthcheck:
      disable: true
    depends_on:
      django:
        condition: service_healthy
    command: sh -c "uv sync --locked && celery --app fairdm.conf.celery worker --loglevel INFO"

volumes:
  postgres: {}
  venv: {}
