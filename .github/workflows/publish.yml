name: Publish

# Publishes to PyPI, and runs only when started by hand.
#
# FairDM is released on GitHub: Prepare Release opens the release pull request,
# and Tag Release creates the tag and the GitHub release when it merges. Portals
# pin FairDM to a release tag. FairDM is not published to PyPI yet, because two
# of its dependencies, django-literature and django-research-vocabs, are
# installed from git, and PyPI refuses a package that depends on a git URL.
# Once both come from PyPI, add the `release: published` trigger back here.
#
# PyPI trusted publishing watches this filename, so the trusted publisher must
# be configured against `publish.yml` before the first PyPI release.

on:
  workflow_dispatch:

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'

      - name: Build package
        run: |
          uv lock --check
          uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
