name: Documentation

# Builds the documentation from main and publishes it to GitHub Pages, at
# https://docs.fairdm.org/. Only the current state of main is published. The
# custom domain is set in the repository's Pages settings, so the site needs no
# CNAME file.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true
          cache-suffix: docs

      - name: Sync dependencies
        run: uv sync --locked --group docs

      # Warnings are errors, so a page with a broken reference never reaches
      # the site.
      - name: Build HTML
        run: uv run --no-sync sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
