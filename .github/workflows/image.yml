name: Image

# Builds the runtime and development images and the demo portal on top of them, then runs
# docker/smoke-test.sh against all three. The check fails on a pull request when a change to the
# Dockerfile, the entrypoint or the code breaks what a portal builds on. On a release tag a second
# job, the only one allowed to write packages, publishes the two images.

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Two runs on the same ref never build and check at the same time.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairdm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release the images are labelled with: the tag without its v, or "dev" elsewhere. A tag
      # that is not a release version fails here, so it can never be published.
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release="${GITHUB_REF_NAME#v}"
            if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a release tag of the form v<major>.<minor>.<patch>"
              exit 1
            fi
            echo "release=$release" >> "$GITHUB_OUTPUT"
          else
            echo "release=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.release }}
          load: true
          push: false
          tags: fairdm-base:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build the development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: development
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.release }}
          load: true
          push: false
          tags: fairdm-base:ci-dev
          cache-from: type=gha,scope=development
          cache-to: type=gha,scope=development,mode=max

      # The portal builds FROM the two images above, which exist only in the Docker engine's own
      # image store. The container builder Buildx set up cannot see that store, so this build
      # uses the engine's builder.
      - name: Build the demo portal
        run: |
          docker buildx build --builder default --load \
            --file docker/portal.Dockerfile \
            --build-arg FAIRDM_IMAGE=fairdm-base \
            --build-arg FAIRDM_VERSION=ci \
            --tag fairdm-demo:ci \
            .

      # PostGIS and Redis are service containers on the runner's localhost, which the script
      # reaches by default.
      - name: Smoke test
        run: docker/smoke-test.sh fairdm-base:ci fairdm-base:ci-dev fairdm-demo:ci

    outputs:
      release: ${{ steps.version.outputs.release }}

  # Only a release tag publishes, and only after the images above passed the smoke test. This job
  # alone can write packages. It rebuilds the two images from the cache the first job filled, then
  # pushes whichever of the two tags the registry does not have yet and leaves the rest.
  Publish:
    needs: Image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: VERSION=${{ needs.Image.outputs.release }}
          load: true
          push: false
          tags: fairdm-base:ci
          cache-from: type=gha,scope=runtime

      - name: Build the development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: development
          platforms: linux/amd64
          build-args: VERSION=${{ needs.Image.outputs.release }}
          load: true
          push: false
          tags: fairdm-base:ci-dev
          cache-from: type=gha,scope=development

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the images
        env:
          RELEASE: ${{ needs.Image.outputs.release }}
        run: docker/publish.sh "$RELEASE"
