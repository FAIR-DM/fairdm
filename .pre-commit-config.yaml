# Pre-commit configuration for FairDM, based on the shared template for django-mvp repositories.
#
# The Python tools (ruff, mypy, deptry) run as *local* hooks through `uv run`,
# so their versions come from the mvp-shared[dev] bundle — one version source
# for every repository, instead of per-repo `rev:` pins that drift under
# autoupdate. `uv run <tool>` at a terminal behaves identically to the hook.
#
# black and pyupgrade are deliberately absent: `ruff format` is a drop-in black
# replacement, and ruff's UP rules cover pyupgrade (enable them in the repo's
# `[tool.ruff.lint]` select list).

exclude: "^docs/|/migrations/|^tests/"
default_stages: [pre-commit]

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Scoped to this package's own sources. Unscoped (the shared default)
      # these also rewrite the spec archive, fixtures and SVG assets, which is
      # churn unrelated to any change being committed.
      - id: trailing-whitespace
        files: ^(fairdm|demo|tests)/.*\.py$
      - id: end-of-file-fixer
        files: ^(fairdm|demo|tests)/.*\.py$
      - id: check-yaml

  # uv-lock rewrites uv.lock when pyproject.toml has moved on. The build
  # workflow's `uv sync --locked` fails on a stale lockfile, so running this
  # here means the lockfile is already correct by the time CI looks at it.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock

  # Local hooks that use the project environment
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      # pass_filenames is off so the run is scoped by `[tool.mypy]` in
      # pyproject.toml. Handing mypy a file list overrides both `files` and
      # `exclude`, which drags in the settings, contrib and plugin modules the
      # config deliberately leaves out. `files` and `types` below still decide
      # whether the hook runs at all.
      #
      # Without require_serial, pre-commit splits the file list into parallel
      # batches, and concurrent mypy processes race on the shared .mypy_cache —
      # INTERNAL ERROR on a cold cache. One serial invocation is also what
      # mirrors-mypy ships.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        require_serial: true
        pass_filenames: false
        types: [python]
        files: ^fairdm/
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true

# pre-commit.ci runs only the env-independent hooks; the local project-env hooks
# run in each repo's own CI (the shared build workflow's Code Quality job).
ci:
  autoupdate_schedule: monthly
  skip: [ruff, ruff-format, mypy, deptry]
  submodules: false
