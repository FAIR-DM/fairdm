{% extends "form_view.html" %}
{# Identifiers and dates are two-column rows, so this page uses the formset `tabular` layout rather than the default `stacked` one. #}
{% block formset %}
  {% if formset %}<c-form.formset :formset="formset" />{% endif %}
  {% for inline in inlines %}<c-form.formset :formset="inline" layout="tabular" />{% endfor %}
{% endblock formset %}
