{% extends "base.html" %}
{% load vocabularies %}

{% block head %}
  {{ block.super }}
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/themes/default/style.min.css" />
{% endblock head %}

{% block body_end %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.2.1/jstree.min.js"></script>
{% endblock body_end %}

{% block content %}
  <style>
    .tooltip-inner {
      max-width: none !important;
    }

    dd {
      padding-left: .5em;
    }
  </style>
  <div class="container py-3">
    <div class="breadcrumbs"></div>
    <div class="row">
      {% block sidebar %}
      {% endblock sidebar %}

      <div class="col">
        <hr class="mt-1" />
        {% block content_inner %}
        {% endblock content_inner %}

      </div>
    </div>
  </div>
{% endblock content %}
