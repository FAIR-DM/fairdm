{% comment %}
  <c-ov.props> — the fields a sample or measurement type adds, label over value in a grid. Fill it
  with <c-ov.prop> entries.
  Attributes: title, edit_url. Slot: the entries.
{% endcomment %}
<c-vars title edit_url />
<c-ov.panel title="{{ title }}" edit_url="{{ edit_url }}" data-card="properties">
  <dl class="ov-props">{{ slot }}</dl>
</c-ov.panel>
