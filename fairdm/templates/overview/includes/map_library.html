{% comment %}
  MapLibre GL, and a map drawn in every `.overview-map` on the page at its data-lon / data-lat.
  Pinned to 5.x: MapLibre 6 ships only as ES modules. Tiles from OpenFreeMap, which needs no key.
{% endcomment %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
      crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"
        integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  (function () {
    if (!window.maplibregl) return;
    document.querySelectorAll(".overview-map[data-lon][data-lat]").forEach(function (el) {
      var point = [parseFloat(el.dataset.lon), parseFloat(el.dataset.lat)];
      var map = new maplibregl.Map({
        container: el,
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: point,
        zoom: 8,
        attributionControl: { compact: true },
        cooperativeGestures: true,
      });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
      new maplibregl.Marker({ color: getComputedStyle(el).getPropertyValue("--color-primary").trim() || undefined })
        .setLngLat(point)
        .addTo(map);
    });
  })();
</script>
