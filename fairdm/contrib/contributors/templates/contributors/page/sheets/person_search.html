{% load i18n %}
{# The search step of the sheet: drawn inside it when it opens, and again when Back returns to it. #}
<div id="contrib-sheet-step" class="contrib-step">
  <div class="sticky top-0 z-10 bg-base-100 pb-1">
    <label class="input contrib-search">
      <c-icon name="search" aria-hidden="true" />
      <input type="search"
             name="q"
             value="{{ query }}"
             autocomplete="off"
             placeholder="{% translate "Search by name or ORCID iD" %}"
             aria-label="{% translate "Search by name or ORCID iD" %}"
             hx-get="{{ request.path }}"
             hx-trigger="input changed delay:250ms, search"
             hx-target="#contrib-person-results"
             hx-swap="innerHTML"
             data-contrib-autofocus>
    </label>
  </div>
  <div id="contrib-person-results">
    {% include "contributors/page/sheets/person_results.html" %}
  </div>
</div>
