{% load i18n %}
{# A sheet's foot: Cancel, small, on the left, Back on a later step, and the step's main button filling the rest. Each step brings its own. #}
<div id="contrib-sheet-actions" class="flex items-center gap-2"{% if oob %} hx-swap-oob="true"{% endif %}>
  <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">{% translate "Cancel" %}</button>
  {% if foot.back %}
    <button type="button" class="btn btn-ghost" hx-get="{{ foot.back }}" hx-target="#contrib-sheet-step" hx-swap="outerHTML" data-contrib-back>
      <c-icon name="chevron-left" aria-hidden="true" /> {% translate "Back" %}
    </button>
  {% endif %}
  {% if foot.submit %}
    <button type="submit" class="btn btn-primary min-w-0 flex-1" form="{{ foot.form|default:"contrib-form" }}" data-contrib-submit>
      {% if foot.icon %}<c-icon name="{{ foot.icon }}" aria-hidden="true" />{% endif %}
      <span class="truncate">{{ foot.submit }}</span>
    </button>
  {% endif %}
</div>
