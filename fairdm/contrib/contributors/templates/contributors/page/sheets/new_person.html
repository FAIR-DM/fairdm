{% load i18n %}
<div id="contrib-sheet-step" class="contrib-step">
  <form id="contrib-new-form" class="contrib-fields" hx-get="{{ step_url }}" hx-target="#contrib-sheet-step" hx-swap="outerHTML">
    <label class="contrib-field">
      <span class="contrib-label">{% translate "Given names" %}</span>
      <input class="input w-full" type="text" name="first_name" value="{{ new_name.first_name }}" autocomplete="off" data-contrib-autofocus>
    </label>
    <label class="contrib-field">
      <span class="contrib-label">{% translate "Family name" %}</span>
      <input class="input w-full{% if error %} input-error{% endif %}" type="text" name="last_name" value="{{ new_name.last_name }}" autocomplete="off" required>
      {% if error %}<span class="contrib-error">{{ error }}</span>{% endif %}
    </label>
  </form>
</div>
