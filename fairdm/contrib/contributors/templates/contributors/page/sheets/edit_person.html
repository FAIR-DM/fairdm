{% load i18n %}
<c-mvp.sheet id="{{ sheet_id }}" title="{{ sheet_title }}" lead="{{ sheet_lead }}" full class="contrib-sheet">
  <c-slot name="art"><c-mvp.avatar :for="person" alt="" size="md" placeholder="{{ person.get_initials }}" only /></c-slot>
  {% include "contributors/page/sheets/credit_form.html" %}
  <c-slot name="actions">
    <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">{% translate "Cancel" %}</button>
    <button type="submit" class="btn btn-primary" form="contrib-form" data-contrib-submit>{{ submit_text }}</button>
  </c-slot>
</c-mvp.sheet>
