{% load i18n %}
{% if found %}
  <ul class="contrib-picks" aria-label="{% translate "People found" %}">
    {% for person in found %}
      <li>
        <button type="button" class="contrib-pick"
                hx-get="{{ step_url }}?person={{ person.uuid }}"
                hx-target="#contrib-sheet-step"
                hx-swap="outerHTML">
          <c-contributor.avatar :contributor="person" size="sm" />
          <span class="contrib-pick-text">
            <span class="contrib-pick-name">{{ person.name }}</span>
            {% with affiliation=person.primary_affiliation %}{% if affiliation %}<span class="contrib-pick-sub">{{ affiliation.organization.name }}</span>{% endif %}{% endwith %}
          </span>
          <c-icon name="chevron-right" aria-hidden="true" />
        </button>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="contrib-none">{% if query %}{% blocktranslate %}Nobody called “{{ query }}” is in the portal.{% endblocktranslate %}{% else %}{% translate "Everyone in the portal is already on this record." %}{% endif %}</p>
{% endif %}
