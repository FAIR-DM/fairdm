{# @description The sheet every step of the Contributors tab opens in: the step's body, and the step's foot buttons below it. Reads sheet_id, sheet_title, sheet_lead and foot from the page. #}
<c-mvp.sheet id="{{ sheet_id }}" title="{{ sheet_title }}" lead="{{ sheet_lead }}" full class="contrib-sheet">
  {{ slot }}
  <c-slot name="actions"><c-contributor.tab.foot /></c-slot>
</c-mvp.sheet>
